<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sunset Golden Hour Calculator - Plan your photography shoots with precise golden hour and blue hour timings for any location and date.">
  <title>Sunset Golden Hour Calculator</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      background-color: #007BFF;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .results {
      margin-top: 20px;
    }
    .results h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    .results p {
      margin: 0;
      font-size: 16px;
    }
    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }
    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }
      h1 {
        font-size: 20px;
      }
      input, button {
        font-size: 14px;
      }
      .results h2 {
        font-size: 18px;
      }
      .results p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- ADSENSE_PLACEHOLDER -->
  <div class="container">
    <h1>Sunset Golden Hour Calculator</h1>
    <label for="location">Location:</label>
    <input type="text" id="location" placeholder="Enter city or coordinates" required>
    <label for="date">Date:</label>
    <input type="date" id="date" required>
    <button onclick="calculateTimes()">Calculate</button>
    <div class="results" id="results">
      <h2>Results</h2>
      <p id="goldenHour"></p>
      <p id="blueHour"></p>
    </div>
  </div>
  <footer>Free tool by MiniAgents.app</footer>
  <script>
    async function calculateTimes() {
      const location = document.getElementById('location').value;
      const date = document.getElementById('date').value;
      if (!location || !date) {
        alert('Please enter both location and date.');
        return;
      }
      try {
        const response = await fetch(`https://api.sunrise-sunset.org/json?formatted=0&lat=${location.split(',')[0]}&lng=${location.split(',')[1]}&date=${date}`);
        const data = await response.json();
        if (data.status === 'OK') {
          const goldenHourStart = new Date(data.results.sunset);
          goldenHourStart.setMinutes(goldenHourStart.getMinutes() - 60);
          const goldenHourEnd = new Date(data.results.sunset);
          const blueHourStart = new Date(data.results.sunset);
          blueHourStart.setMinutes(blueHourStart.getMinutes() - 90);
          const blueHourEnd = new Date(data.results.sunset);
          blueHourEnd.setMinutes(blueHourEnd.getMinutes() - 60);
          document.getElementById('goldenHour').innerText = `Golden Hour: ${goldenHourStart.toLocaleTimeString()} - ${goldenHourEnd.toLocaleTimeString()}`;
          document.getElementById('blueHour').innerText = `Blue Hour: ${blueHourStart.toLocaleTimeString()} - ${blueHourEnd.toLocaleTimeString()}`;
        } else {
          alert('Error fetching data. Please check your location and try again.');
        }
      } catch (error) {
        alert('An error occurred. Please try again later.');
      }
    }
  </script>
</body>
</html>
